resources:
  jobs:
    streamline_batch_orchestrator_job:
      name: streamline_batch_orchestrator_job
      schedule:
        quartz_cron_expression: 49 0 2 * * ?
        timezone_id: Asia/Calcutta
        pause_status: UNPAUSED
      tasks:
        - task_key: streamline_clickstream_pipeline
          run_job_task:
            job_id: ${resources.jobs.streamline_clickstream_pipeline.id}
        - task_key: streamline_customers_pipeline
          run_job_task:
            job_id: ${resources.jobs.streamline_customers_pipeline.id}
        - task_key: streamline_orders_silver
          run_job_task:
            job_id: ${resources.jobs.streamline_orders_silver.id}
        - task_key: gold_customer_360
          depends_on:
            - task_key: streamline_orders_silver
            - task_key: streamline_customers_pipeline
          notebook_task:
            notebook_path: ../notebooks/aggregations/gold_customer_360
            source: WORKSPACE
          job_cluster_key: Job_cluster
          max_retries: 2
          min_retry_interval_millis: 300000
        - task_key: streamline_payment_pipeline
          run_job_task:
            job_id: ${resources.jobs.streamline_payments_pipeline.id}
        - task_key: streamline_products_pipeline
          run_job_task:
            job_id: ${resources.jobs.streamline_products_pipeline.id}
        - task_key: gold_orders_daily_summary
          depends_on:
            - task_key: streamline_orders_silver
            - task_key: streamline_products_pipeline
            - task_key: streamline_customers_pipeline
          notebook_task:
            notebook_path: ../notebooks/aggregations/gold_orders_daily_summary
            source: WORKSPACE
          job_cluster_key: Job_cluster
          max_retries: 2
          min_retry_interval_millis: 300000
        - task_key: gold_quality_metrics
          depends_on:
            - task_key: streamline_payment_pipeline
            - task_key: streamline_clickstream_pipeline
            - task_key: streamline_products_pipeline
            - task_key: streamline_orders_silver
            - task_key: streamline_customers_pipeline
          notebook_task:
            notebook_path: ../notebooks/aggregations/gold_quality_metrics
            source: WORKSPACE
          job_cluster_key: Job_cluster
          max_retries: 2
          min_retry_interval_millis: 300000
      job_clusters:
        - job_cluster_key: Job_cluster
          new_cluster:
            cluster_name: ""
            spark_version: 17.3.x-scala2.13
            azure_attributes:
              first_on_demand: 1
              spot_bid_max_price: -1
            node_type_id: Standard_D4ds_v5
            spark_env_vars:
              PYSPARK_PYTHON: /databricks/python3/bin/python3
            data_security_mode: DATA_SECURITY_MODE_DEDICATED
            runtime_engine: STANDARD
            kind: CLASSIC_PREVIEW
            is_single_node: true
      queue:
        enabled: true
      parameters:
        - name: env
          default: ${var.env}
        - name: start_datetime
          default: ""
        - name: end_datetime
          default: ""
        - name: start_date
          default: ""
        - name: end_date
          default: ""
      run_as:
        service_principal_name: ${var.service_principal_id}