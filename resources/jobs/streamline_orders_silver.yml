resources:
  jobs:
    streamline_orders_silver:
      name: streamline_orders_silver
      email_notifications:
        on_failure:
          - dilip.dot.dot@gmail.com
      tasks:
        - task_key: Silver_Orders
          notebook_task:
            notebook_path: ../notebooks/transformations/silver_orders.py
            source: WORKSPACE
            base_parameters:
              bundle_root: ${workspace.file_path}
          job_cluster_key: Silver_Orders_cluster
          max_retries: 2
          min_retry_interval_millis: 300000
      job_clusters:
        - job_cluster_key: Silver_Orders_cluster
          new_cluster:
            cluster_name: ""
            spark_version: 17.3.x-scala2.13
            node_type_id: Standard_D4ds_v5
            spark_env_vars:
              PYSPARK_PYTHON: /databricks/python3/bin/python3
            data_security_mode: DATA_SECURITY_MODE_DEDICATED
            runtime_engine: STANDARD
            kind: CLASSIC_PREVIEW
            is_single_node: true
      queue:
        enabled: true
      parameters:
        - name: env
          default: ${var.env}
        - name: start_datetime
          default: ""
        - name: end_datetime
          default: ""
      run_as:
        service_principal_name: ${var.service_principal_id}