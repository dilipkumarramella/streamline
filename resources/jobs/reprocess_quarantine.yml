resources:
  jobs:
    reprocess_quarantine:
      name: reprocess_quarantine
      email_notifications:
        on_failure:
          - dilip.dot.dot@gmail.com
      tasks:
        - task_key: reprocess_quarantine
          notebook_task:
            notebook_path: ../notebooks/maintenance/reprocess_quarantine.py
            source: WORKSPACE
            base_parameters:
              bundle_root: ${workspace.file_path}
          job_cluster_key: Job_cluster
      job_clusters:
        - job_cluster_key: Job_cluster
          new_cluster:
            cluster_name: ""
            spark_version: 17.3.x-scala2.13
            azure_attributes:
              first_on_demand: 1
              spot_bid_max_price: -1
            node_type_id: Standard_D4ds_v4
            spark_env_vars:
              PYSPARK_PYTHON: /databricks/python3/bin/python3
            data_security_mode: DATA_SECURITY_MODE_DEDICATED
            runtime_engine: STANDARD
            kind: CLASSIC_PREVIEW
            is_single_node: true
      queue:
        enabled: true
      parameters:
        - name: source
        - name: env
          default: ${var.env}
      run_as:
        service_principal_name: b7cf2661-4e6b-4dbb-a8f8-a5429a9a8d15
